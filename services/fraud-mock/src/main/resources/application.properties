quarkus.application.name=fraud-mock
quarkus.http.port=8082
quarkus.http.test-port=0
quarkus.log.console.format=%d{HH:mm:ss.SSS} %-5p [%c{1.}] [cid:%X{correlationId}] %s%e%n

mp.openapi.scan.disable=true
quarkus.swagger-ui.always-include=true

fraud.policy.max-amount=10000
fraud.policy.blocked-accounts=9999999999
fraud.simulated-latency=0s

# --- local profile: run from the IDE (dev mode, live reload, debugger) against docker-compose ---
%local.quarkus.config.profile.parent=dev
