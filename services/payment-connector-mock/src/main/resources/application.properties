quarkus.application.name=payment-connector-mock
quarkus.http.port=8083
quarkus.http.test-port=0
quarkus.log.console.format=%d{HH:mm:ss.SSS} %-5p [%c{1.}] %s%e%n
quarkus.log.category."org.apache.kafka".level=WARN

%prod.kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
# Dev mode: reuses the Kafka container started by Dev Services for the transfer service (or starts it if first).
quarkus.kafka.devservices.shared=true
quarkus.kafka.devservices.service-name=transfer-saga-kafka
quarkus.kafka.devservices.topic-partitions.payment-orders=3
quarkus.kafka.devservices.topic-partitions.payment-results=3
mp.messaging.incoming.payment-orders.connector=smallrye-kafka
mp.messaging.incoming.payment-orders.topic=payment-orders
mp.messaging.incoming.payment-orders.group.id=payment-connector
mp.messaging.incoming.payment-orders.auto.offset.reset=earliest
mp.messaging.incoming.payment-orders.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.payment-orders.failure-strategy=dead-letter-queue
mp.messaging.incoming.payment-orders.dead-letter-queue.topic=payment-orders-dlq
mp.messaging.outgoing.payment-results.connector=smallrye-kafka
mp.messaging.outgoing.payment-results.topic=payment-results
mp.messaging.outgoing.payment-results.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.payment-results.value.serializer=org.apache.kafka.common.serialization.StringSerializer

connector.rpi-latency=300ms
connector.spi-latency=3s

# --- local profile: run from the IDE (dev mode, live reload, debugger) against docker-compose ---
%local.quarkus.config.profile.parent=dev
# A configured broker turns Kafka Dev Services off.
%local.kafka.bootstrap.servers=localhost:9092
