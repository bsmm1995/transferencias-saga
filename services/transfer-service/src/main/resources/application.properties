quarkus.application.name=transfer-service
quarkus.http.port=8080
quarkus.http.test-port=0
quarkus.log.console.format=%d{HH:mm:ss.SSS} %-5p [%c{1.}] [cid:%X{correlationId}] %s%e%n
%dev.quarkus.log.category."ec.fin".level=DEBUG
%test.quarkus.log.category."ec.fin".level=DEBUG
quarkus.log.category."org.apache.kafka".level=WARN

# --- Database: Quarkus Dev Services start PostgreSQL in dev and test mode; docker-compose is used in prod mode ---
quarkus.datasource.db-kind=postgresql
%prod.quarkus.datasource.jdbc.url=${DB_URL:jdbc:postgresql://localhost:5432/transfers}
%prod.quarkus.datasource.username=${DB_USER:transfers}
# No default for the secret: prod mode refuses to start without DB_PASSWORD.
%prod.quarkus.datasource.password=${DB_PASSWORD}
quarkus.datasource.devservices.db-name=transfers
quarkus.datasource.devservices.username=transfers
quarkus.datasource.devservices.password=transfers
%dev.quarkus.datasource.devservices.port=5433
quarkus.liquibase.migrate-at-start=true
quarkus.liquibase.change-log=db/changelog/db.changelog-master.yaml
# Liquibase owns the schema; Hibernate only checks the mapping matches it.
quarkus.hibernate-orm.schema-management.strategy=validate

# --- Messaging: Kafka stands in for EventBridge + SQS ---
%prod.kafka.bootstrap.servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
# Dev mode: one Kafka container (Dev Services) shared by every service started with quarkusDev.
quarkus.kafka.devservices.shared=true
quarkus.kafka.devservices.service-name=transfer-saga-kafka
quarkus.kafka.devservices.topic-partitions.payment-orders=3
quarkus.kafka.devservices.topic-partitions.payment-results=3
quarkus.kafka.devservices.topic-partitions.transfer-events=3
mp.messaging.outgoing.outbox.connector=smallrye-kafka
mp.messaging.outgoing.outbox.topic=transfer-events
mp.messaging.outgoing.outbox.key.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.outbox.value.serializer=org.apache.kafka.common.serialization.StringSerializer
mp.messaging.outgoing.outbox.acks=all
mp.messaging.outgoing.outbox.enable.idempotence=true
mp.messaging.incoming.payment-results.connector=smallrye-kafka
mp.messaging.incoming.payment-results.topic=payment-results
mp.messaging.incoming.payment-results.group.id=transfer-service
mp.messaging.incoming.payment-results.auto.offset.reset=earliest
mp.messaging.incoming.payment-results.key.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.payment-results.value.deserializer=org.apache.kafka.common.serialization.StringDeserializer
mp.messaging.incoming.payment-results.failure-strategy=dead-letter-queue
mp.messaging.incoming.payment-results.dead-letter-queue.topic=payment-results-dlq

# --- Participants (generated REST clients) ---
quarkus.rest-client.core-banking.url=${CORE_BANKING_URL:http://localhost:8081}
quarkus.rest-client.core-banking.connect-timeout=1000
quarkus.rest-client.core-banking.read-timeout=2500
quarkus.rest-client.core-banking.providers=ec.fin.commons.web.correlation.CorrelationIdClientFilter
quarkus.rest-client.fraud-engine.url=${FRAUD_ENGINE_URL:http://localhost:8082}
quarkus.rest-client.fraud-engine.connect-timeout=1000
quarkus.rest-client.fraud-engine.read-timeout=1500
quarkus.rest-client.fraud-engine.providers=ec.fin.commons.web.correlation.CorrelationIdClientFilter

# --- API-first: serve contracts/openapi/transfer-api.yaml instead of scanning the code ---
mp.openapi.scan.disable=true
quarkus.swagger-ui.always-include=true
# Bundled in every build, but only served in prod mode when explicitly enabled.
%prod.quarkus.swagger-ui.enabled=${SWAGGER_UI_ENABLED:false}

# --- Business configuration ---
transfer.rails.own-bank-code=001
transfer.rails.instant-bank-codes=010,017,036
transfer.saga.poll-interval=1s
transfer.saga.batch-size=50
transfer.saga.max-attempts=6
transfer.saga.initial-backoff=1s
transfer.saga.backoff-multiplier=2
transfer.saga.max-backoff=30s
transfer.saga.payment-result-timeout=15s
transfer.saga.max-payment-inquiries=2
transfer.outbox.poll-interval=500ms
transfer.outbox.batch-size=100
transfer.outbox.retention=7d
transfer.idempotency.retention=24h
transfer.idempotency.purge-interval=1h

# --- Tests: faster timings, Kafka replaced by the in-memory connector ---
%test.quarkus.kafka.devservices.enabled=false
%test.transfer.saga.poll-interval=200ms
%test.transfer.saga.initial-backoff=100ms
%test.transfer.saga.max-backoff=1s
%test.transfer.saga.payment-result-timeout=30s
%test.transfer.outbox.poll-interval=100ms
