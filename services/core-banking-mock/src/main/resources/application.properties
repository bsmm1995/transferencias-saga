quarkus.application.name=core-banking-mock
quarkus.http.port=8081
quarkus.http.test-port=0
quarkus.log.console.format=%d{HH:mm:ss.SSS} %-5p [%c{1.}] [cid:%X{correlationId}] %s%e%n

mp.openapi.scan.disable=true
quarkus.swagger-ui.always-include=true

# Failure injection, also adjustable at runtime with PUT /core/v1/admin/chaos
core.chaos.failure-rate=0
core.chaos.mode=BEFORE_APPLY
